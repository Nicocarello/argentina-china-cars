name: Auto Update DNRPA Monthly Data

on:
  # Ejecución automática periódica (DNRPA suele publicar entre el 5 y el 18 de cada mes)
  schedule:
    - cron: '0 12 5,10,15,20 * *' # A las 12:00 UTC en los días 5, 10, 15 y 20 de cada mes

  # Ejecución manual desde la pestaña Actions en GitHub
  workflow_dispatch:
    inputs:
      force:
        description: 'Forzar reprocesamiento completo'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  update-dashboard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código del repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar entorno Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependencias necesarias
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy

      - name: Ejecutar Pipeline de Actualización DNRPA
        run: |
          if [ "${{ inputs.force }}" = "true" ]; then
            python scripts/update_pipeline.py --force
          else
            python scripts/update_pipeline.py
          fi

      - name: Verificar si se generaron cambios en dashboard_data.json
        id: git_diff
        run: |
          if git diff --quiet data/dashboard_data.json; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "No hay nuevos meses publicados por DNRPA. Dashboard al día."
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "¡Nuevos datos detectados y procesados!"
          fi

      - name: Commitear y pushear actualización a la rama principal
        if: steps.git_diff.outputs.changed == 'true'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/dashboard_data.json
          git commit -m "chore(data): auto-update DNRPA monthly dashboard data [skip ci]"
          git push origin main
